name: Generate site
description: >
  Generate a static site with Podval site-publisher into <source>/<target-directory-name>
  (default <source>/_site). Resolves org.podval.tools:org.podval.tools.publisher from
  Maven Central (version input, or gradle.properties of this action ref). Does not
  compile the publisher from the action checkout.

inputs:
  source:
    description: >
      Path to the site source directory (must contain _site_config.yml).
      Relative paths are resolved against GITHUB_WORKSPACE (the content repository checkout).
    required: false
    default: '.'
  target-directory-name:
    description: Name of the output directory under source (passed as --target-directory-name).
    required: false
    default: '_site'
  treat-errors-as-warnings:
    description: If true, pass --treat-errors-as-warnings=true.
    required: false
    default: 'true'
  include-drafts:
    description: If true, pass --include-drafts=true.
    required: false
    default: 'false'
  production:
    description: If true, pass --production=true.
    required: false
    default: 'false'
  log-level:
    description: Optional log level (e.g. INFO, DEBUG). Empty uses site-publisher default (INFO).
    required: false
    default: ''
  version:
    description: >
      Maven Central version of org.podval.tools:org.podval.tools.publisher.
      Empty reads version= from gradle.properties next to this action's repository root.
    required: false
    default: ''
  java-version:
    description: JDK version for running site-publisher.
    required: false
    default: '25'
  java-distribution:
    description: actions/setup-java distribution (e.g. temurin, oracle).
    required: false
    default: 'temurin'

outputs:
  site-path:
    description: Absolute path to the generated site directory.
    value: ${{ steps.generate.outputs.site-path }}
  source-path:
    description: Absolute path to the site source directory used for generation.
    value: ${{ steps.generate.outputs.source-path }}

runs:
  using: composite
  steps:
    - name: Set up JDK ${{ inputs.java-version }}
      uses: actions/setup-java@v5
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.gradle/ms-playwright
        key: playwright-${{ runner.os }}-ms-playwright

    - name: Generate site
      id: generate
      shell: bash
      run: |
        set -euo pipefail

        publisher_root="$(cd "${{ github.action_path }}/../../.." && pwd)"
        if [[ ! -x "$publisher_root/gradlew" ]]; then
          echo "::error::gradlew not found under publisher root: $publisher_root"
          exit 1
        fi

        source_input="${{ inputs.source }}"
        if [[ -z "$source_input" ]]; then
          source_input='.'
        fi
        case "$source_input" in
          /*) source_path="$source_input" ;;
          *)  source_path="${GITHUB_WORKSPACE%/}/$source_input" ;;
        esac
        if [[ ! -d "$source_path" ]]; then
          echo "::error::Site source directory does not exist: $source_path"
          exit 1
        fi
        source_path="$(cd "$source_path" && pwd)"

        target_name="${{ inputs.target-directory-name }}"
        if [[ -z "$target_name" ]]; then
          target_name='_site'
        fi
        site_path="$source_path/$target_name"

        version="${{ inputs.version }}"
        if [[ -z "$version" ]]; then
          version="$(awk -F= '/^version=/{print $2; exit}' "$publisher_root/gradle.properties")"
        fi
        if [[ -z "$version" ]]; then
          echo "::error::Publisher version is empty (set inputs.version or gradle.properties version=)"
          exit 1
        fi

        args=("$source_path")
        args+=("--target-directory-name=$target_name")
        if [[ "${{ inputs.treat-errors-as-warnings }}" == "true" ]]; then
          args+=(--treat-errors-as-warnings=true)
        fi
        if [[ "${{ inputs.include-drafts }}" == "true" ]]; then
          args+=(--include-drafts=true)
        fi
        if [[ "${{ inputs.production }}" == "true" ]]; then
          args+=(--production=true)
        fi
        log_level="${{ inputs.log-level }}"
        if [[ -n "$log_level" ]]; then
          args+=("--log-level=$log_level")
        fi

        run_dir="${RUNNER_TEMP:-/tmp}/site-publisher-run"
        rm -rf "$run_dir"
        mkdir -p "$run_dir"
        printf '%s\n' "${args[@]}" > "$run_dir/args.txt"
        printf 'publisherVersion=%s\n' "$version" > "$run_dir/gradle.properties"

        cat > "$run_dir/settings.gradle" <<'EOF'
        rootProject.name = 'site-publisher-run'
        EOF

        cat > "$run_dir/build.gradle" <<'EOF'
        plugins {
          id 'java'
        }
        repositories {
          mavenCentral()
        }
        configurations {
          sitePublisher
        }
        dependencies {
          sitePublisher "org.podval.tools:org.podval.tools.publisher:${providers.gradleProperty('publisherVersion').get()}"
        }
        tasks.register('generateSite', JavaExec) {
          classpath = configurations.sitePublisher
          mainClass.set('org.podval.tools.publish.site.Site')
          args = file('args.txt').readLines()
          jvmArgs = [
            '--enable-native-access=ALL-UNNAMED',
            '--sun-misc-unsafe-memory-access=allow',
          ]
          environment 'PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS', '1'
          environment 'PLAYWRIGHT_BROWSERS_PATH', "${gradle.gradleUserHomeDir}/ms-playwright"
        }
        EOF

        echo "Publisher version: $version"
        echo "Source path:       $source_path"
        echo "Site path:         $site_path"

        (
          cd "$publisher_root"
          ./gradlew --no-daemon -p "$run_dir" generateSite
        )

        if [[ ! -d "$site_path" ]]; then
          echo "::error::Expected output directory was not created: $site_path"
          exit 1
        fi

        echo "source-path=$source_path" >> "$GITHUB_OUTPUT"
        echo "site-path=$site_path" >> "$GITHUB_OUTPUT"
