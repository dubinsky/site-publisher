pluginManagement {
  repositories {
    mavenCentral()
    gradlePluginPortal()
  }
  // String path: a File would call Settings.includeBuild (not a plugin build).
  final String conventionsDir =
    providers.gradleProperty('podvalGradleDir').getOrElse('../podval-gradle')
  if (file(conventionsDir).isDirectory() && file("${conventionsDir}/settings.gradle").isFile()) {
    includeBuild conventionsDir
  }
}

plugins {
  id 'org.podval.conventions.settings' version '0.1.0'
  // Applies com.gradleup.nmcp to maven-publish projects and aggregation on the root.
  // https://gradleup.com/nmcp/
  id 'com.gradleup.nmcp.settings' version '1.6.2'
}

rootProject.name = 'site-publisher'
include 'publisher'
project(':publisher').name = 'org.podval.tools.publisher'
include 'plugin'
project(':plugin').name = 'site-publisher-plugin'

// ./gradlew nmcpZipAggregation — inspect the zip
// ./gradlew publishAggregationToCentralPortal — upload (USER_MANAGED)
// https://central.sonatype.com/publishing/deployments — release
nmcpSettings {
  centralPortal {
    publishingType = 'USER_MANAGED'
    username = providers.gradleProperty('mavenCentralUsername')
    password = providers.gradleProperty('mavenCentralPassword')
  }
}

// Composite: substitute org.podval:org.podval.xml from a sibling checkout.
// Override with -PxmlDir=/path/to/xml. If the directory is missing, Gradle
// resolves the artifact from Maven Central.
final File xmlDir = file(providers.gradleProperty('xmlDir').getOrElse('../xml'))
if (xmlDir.isDirectory() && new File(xmlDir, 'settings.gradle').isFile()) {
  includeBuild(xmlDir)
}

